# =============================================================================
# Wattplot Controller v3 — ESPHome firmware
# =============================================================================
# Pin map aligned to the schematic (rev B, 2026-08-03).
# Target: ESP32-S3-DevKitC-1-N16R8 (16 MB flash, 8 MB PSRAM).
#
# Migration notes (from the v2.x YAML, which had ESP32-C3-era pinouts):
#   - The schematic is the source of truth for new pin assignments.
#   - The components that rev B REMOVED (status LED, limit switches,
#     h-bridge EN, solenoid IN2, MCP23017 expander) are kept in the
#     firmware but reassigned to schematic "free" pins, so the existing
#     state-machine references still resolve. Their actions have no
#     physical effect (board does not wire them), but the IDs and
#     script.execute calls keep working.
#   - The schematic's new components (Motor IPROPI, Solenoid IPROPI) are
#     added. They replace the limit-switch-based homing with current-
#     based homing (see hardware/wattplot_schematic.png Section 9).
#
# Pin map (final, after v3 migration):
#
# Subsystem tags: [Actuator] = panel tilt, [Solenoid] = water/latch,
#                 [Power] = power tree, [Sensor] = sensors, [HMI] = status.
#
#   GPIO  1: Actuator H-bridge IN1 (U5a)             [schematic, Actuator]
#   GPIO  2: Actuator H-bridge IN2 (U5a)             [schematic, Actuator]
#   GPIO  4: Actuator IPROPI (ADC1_CH4, current sense) [schematic, NEW, Actuator]
#   GPIO  5: Solenoid IPROPI (ADC1_CH5, jam detect)   [schematic, NEW, Solenoid]
#   GPIO  6: Soil moisture (ADC1_CH6)                 [schematic, Sensor; was GPIO3]
#   GPIO  7: Battery V ADC (ADC1_CH7)                 [schematic, Power; was GPIO4]
#   GPIO  8: I2C SDA                                  [schematic, Sensor; was GPIO5]
#   GPIO 10: Solenoid H-bridge IN1 (U5b)              [schematic, Solenoid; was GPIO7]
#   GPIO 11: Actuator H-bridge EN (preserved, free)   [compat, Actuator; was GPIO2]
#   GPIO 12: Solenoid IN2 (preserved, schematic free) [compat, Solenoid; was GPIO9]
#   GPIO 13: Solenoid nFAULT (direct GPIO)            [schematic, Solenoid; was MCP.1]
#   GPIO 14: Limit 0° switch (preserved, free pin)    [compat; was GPIO10]
#   GPIO 15: Limit 35° switch (preserved, free pin)   [compat; was GPIO21]
#   GPIO 16: DS18B20 1-Wire data                      [schematic, Sensor; was GPIO15]
#   GPIO 17: Status LED (preserved)                   [compat, HMI; was GPIO8]
#   GPIO 18: I2C SCL                                  [schematic, Sensor; was GPIO6]
#   GPIO 21: Motor nFAULT (direct GPIO)               [schematic; was MCP.0]
#
# Free GPIOs (per schematic): 4, 5, 6, 7, 8, 11, 12, 13, 14, 15, 16, 17, 18, 21 used.
#   Remaining: GPIO 39, 40, 41, 42, 47, 48 (the on-board RGB is on
#   GPIO 48 but unused).
#
# I2C bus (shared, 400 kHz, 4.7 kΩ pull-ups on SDA/SCL):
#   0x40  INA219    — motor current + actuator bus V (shunt 0.1 Ω, 3.2 A)
#   0x41  INA219    — panel V/I for energy monitor (shunt 0.1 Ω, 1.0 A)
#   0x68  (reserved) BMI160 / MPU6050 panel tilt IMU, future
#   (MCP23017 removed in v3 — nFAULT lines now read direct GPIO)
#
# S3-specific notes:
#   - GPIO 19, 20 are native USB D-/D+ — DO NOT use as GPIO.
#   - GPIO 26-32 are SPI flash on the WROOM module — DO NOT use.
#   - GPIO 33-37 are PSRAM on the N16R8 variant — DO NOT use.
#   - ADC1: GPIO 1-10. ADC2: GPIO 11-20. We use ADC1 throughout.
#   - 8 MB PSRAM is allocated for firmware heap.
# =============================================================================
substitutions:
  device_name: wattplot-controller
  friendly_name: "Wattplot Controller"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Wattplot v3.2 — PI on motor current, IMU feedback, panel-side energy monitoring, soil-aware tilt. Charge control: external Sunapex 10A MPPT."
  min_version: 2024.6.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: status_led
          brightness: 30%
      - delay: 1s
      # v3.2: rich boot log — captures firmware version, restart
      # reason, free heap, IP, and the build timestamp into the
      # Last Event text sensor + emits structured ESP_LOGI lines.
      # Every one of these lines is forwarded to the MQTT log
      # topic (wattplot/log) by the existing mqtt: config.
      - lambda: |-
          // v3.2 boot log. ESPHome lambdas in 2026.7.2 don't have
          // access to the WiFi global or ESP.getResetReason() wrapper;
          // we use ESP-IDF's esp_reset_reason() and skip WiFi info
          // (visible via web UI / HA's device tracker).
          char buf[160];
          snprintf(buf, sizeof(buf),
                   "Boot: %s reason=%d heap=%u",
                   __DATE__ " " __TIME__,
                   (int)esp_reset_reason(),
                   (unsigned)ESP.getFreeHeap());
          id(g_last_event) = buf;
          ESP_LOGI("boot", "=== Wattplot v3.2 ===");
          ESP_LOGI("boot", "  build:       %s %s", __DATE__, __TIME__);
          ESP_LOGI("boot", "  reason:      %d", (int)esp_reset_reason());
          ESP_LOGI("boot", "  free heap:   %u bytes", (unsigned)ESP.getFreeHeap());
      - script.execute: actuator_stop
      - script.execute: state_to_folding

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: arduino
    version: recommended

logger:
  level: DEBUG
  # v2.5: forward all log lines to MQTT topic 'wattplot/log' so a
  # subscriber on the local PC (tools/log_subscriber.py) can write
  # them to a rotating wattplot.log file. Set MQTT broker in secrets.
  # Disable with `mqtt_log_enabled: false` if not using MQTT logging.
  logs:
    "mqtt.log": DEBUG
    "api": INFO        # connection / password events, not noise
    "ota": INFO        # OTA start/finish, not the byte-by-byte progress
    "wifi": INFO       # state transitions, signal changes
    "state": INFO      # our state machine transitions
    "nfault": WARN     # actuator/solenoid fault events
    "solenoid": INFO   # valve on/off + auto-water guard events
    "endpoint": INFO   # endstop hits
    "calib": INFO      # self-calibration events
    "alarm": INFO      # watering alarms
    "control": INFO    # 1Hz control loop events


# ===== Connectivity =====
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# v2.5: MQTT for log streaming. Optional but enables log_subscriber.py
# to write all ESPHome logs to wattplot.log on your PC. If you don't
# have a broker, comment out this whole mqtt: block.
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "wattplot"
  # Log all component logs to MQTT topic wattplot/log (see tools/log_subscriber.py)
  log_topic: "wattplot/log"
  birth_message:
    topic: "wattplot/status"
    payload: "online"
    retain: true
  will_message:
    topic: "wattplot/status"
    payload: "offline"
    retain: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wattplot-Setup"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Phoenix"

# ===== Solar position (built-in, no library needed) =====
sun:
  latitude: 33.45°
  longitude: -112.07°

# ===== HTTP request (NWS forecast poll) =====
http_request:
  useragent: "WattplotController/1.0"
  timeout: 8s

# ===== I2C bus =====
# v3: pins migrated to schematic rev B (SDA=GPIO8, SCL=GPIO18).
i2c:
  - id: i2c_main
    sda: GPIO8
    scl: GPIO18
    scan: true

# ===== IMU — closed-loop panel tilt feedback =====
# bmi160 is disabled in this revision: ESPHome 2026.7.2 no longer exposes
# bmi160 via YAML CONFIG_SCHEMA. The original block is preserved below for
# reference; to re-enable, either (a) pin ESPHome to <= 2026.6, (b) write
# a custom C++ component wrapping the BMI160 driver, or (c) swap to an
# MPU6050 (drop-in I2C, full YAML support in current ESPHome).
#
# bmi160:
#   - id: bmi_imu
#     i2c_id: i2c_main
#     address: 0x68
#     update_interval: 100ms
#     acceleration_x:
#       name: "Panel Accel X"
#       id: imu_accel_x
#     acceleration_y:
#       name: "Panel Accel Y"
#       id: imu_accel_y
#     acceleration_z:
#       name: "Panel Accel Z"
#       id: imu_accel_z

# ===== INA219 — motor current + panel bus V =====
# Re-enabled 2026-08-01 (the v2.5 actuator/solenoid wiring pass).
# In ESPHome 2026.7.2 the ina219 component is exposed as a sensor
# platform only — the top-level `ina219:` block was removed. The
# matching sensor entries live in the `sensor:` block under
# "Analog inputs" below. The IDs `motor_current`, `panel_v`, and
# `panel_current` are now real; `panel_voltage` (an old stub) is
# removed.
#
# INA219 #1 (U6a in the schematic): actuator current sense on the
#   0.1Ω shunt between U5a OUT-side ground and chassis ground. IN+ on
#   the actuator side, IN− on the chassis side. The INA219 measures
#   the *bus voltage* on its VBUS pin (12V battery) — useful for
#   detecting a brownout when the actuator stalls, and as a sanity
#   cross-check against the dedicated 100k/10k divider on GPIO4.
# INA219 #2 (U6b): panel-side V/I sense on the panel's MC4 output.
#   INA219 PV+ → panel+, INA219 PV− → MPPT PV+. Shunt on the
#   low-side return to MPPT. Used by `panel_power_w` to drive the
#   energy integration.
#
# The INA219 ALERT pin is NOT wired (no free GPIO) — overcurrent
# alerts are not used. Polled reads at 200 ms (motor) and 1 s (panel).
#
# IMPORTANT: both INA219s must be physically present on the I2C bus
# before flashing. If either is missing, `esphome config` will fail
# with a clear I2C error and the firmware will refuse to start.

# ===== MCP23017 — REMOVED in v3 =====
# The schematic rev B (2026-08-03) routes nFAULT directly to GPIO:
#   - Motor nFAULT   → GPIO21
#   - Solenoid nFAULT → GPIO13
# No MCP23017 needed; the I2C expander is gone from the BOM.
# The IDs `actuator_nfault` and `solenoid_nfault` are preserved in the
# `binary_sensor:` section below so state-machine references compile.

# ===== Temperature (DS18B20, 1-Wire) =====
# v2.6: DS18B20 re-enabled. In ESPHome 2026.7.2 the `dallas_temp` component
# no longer ships a top-level CONFIG_SCHEMA (it moved into sensor.py as a
# sensor: platform). The top-level `dallas_temp:` block therefore fails
# with "no CONFIG_SCHEMA" — use `sensor: - platform: dallas_temp` instead.
# The `panel_temperature` id is preserved so DLI + grow-light lambdas
# resolve correctly.
#
# v2.7: Single-pin scan on GPIO 20 found the panel sensor. Working.
#
# v2.8: 3 sensors on one bus (parallel wiring, single 4.7kΩ pull-up).
#   - Panel Temperature (existing, panel back surface)
#   - Soil Temperature (NEW, waterproof probe, ~5cm depth, for frost watch)
#   - Canopy Air Temperature (NEW, in plant canopy, for frost + DLI sanity)
#   Order on bus is implicit (index 0/1/2 by discovery order). If a sensor
#   reads as the wrong value after wiring, swap the `index:` field on the
#   two affected blocks. Both new sensors will report NaN until physical
#   probes are wired — device stays stable, MQTT publishes "nan".
one_wire:
  - platform: gpio
    # v3: schematic rev B places OneWire on GPIO16 (was GPIO15).
    pin: GPIO16
    id: panel_temp_bus

# ===== UART =====
# No UART active on the mini. GPIO 26/27 are reserved (former DPS5005
# UART pins). On the full-size build, these will likely be reused for
# RS-485 to a Victron/EPEver MPPT, or VE.Direct to a Victron SmartSolar.

# ===== Actuator H-bridge outputs (DRV8871, U5a — panel tilt) =====
# ===== Status LED PWM (C3 DevKitM-1 on-board LED on GPIO 8) =====
# C3 port: replaced WS2812B with single-color on-board LED driven via LEDC.
# GPIO 8 on the DevKitM-1 is wired to a transistor that drives the on-board
# LED; setting GPIO 8 HIGH lights it. Scripts set brightness (red/green/blue
# parameters are ignored on a monochromatic light).
output:
  # v3: pin numbers migrated to schematic rev B. See header for full map.
  # These three outputs drive the ACTUATOR H-bridge (U5a) only - the linear
  # actuator that tilts the panel. The SOLENOID H-bridge (U5b) is defined
  # separately below. Don't confuse them.
  - platform: gpio
    id: hb_in1_out    # Actuator H-bridge IN1 (U5a)
    pin: GPIO1
  - platform: gpio
    id: hb_in2_out    # Actuator H-bridge IN2 (U5a)
    pin: GPIO2
  - platform: gpio
    # Schematic ties EN to 3V3 (always on); preserved here for state-machine
    # compatibility. Reassigned to a schematic "free" pin (GPIO11).
    id: hb_en_out     # Actuator H-bridge EN (U5a, preserved for state-machine compat)
    pin: GPIO11
  # Solenoid driver (v3) — second DRV8871 (U5b) in single-direction H-bridge mode.
  # IN1=HIGH/IN2=LOW drives the solenoid forward; both LOW = coast (off).
  # IN2=HIGH would drive reverse — never used (solenoid is single-direction).
  # nSLEEP is tied to 3V3 on the board via 100kΩ — U5b is always enabled.
  # v3: schematic ties solenoid IN2 to GND (single-direction); preserved here
  # for state-machine compatibility on a schematic "free" pin (GPIO12).
  - platform: gpio
    id: solenoid_in1_out
    pin: GPIO10
  - platform: gpio
    id: solenoid_in2_out
    pin: GPIO12
  - platform: ledc
    # Status LED: schematic rev B removed the LED from the design. Preserved
    # on GPIO17 (unused GPIO) for state-machine compatibility.
    id: status_led_pwm
    pin: GPIO17
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: status_led
    name: "Status LED"
    output: status_led_pwm
    default_transition_length: 0ms

# ===== Analog inputs =====
sensor:
  - platform: dallas_temp
    one_wire_id: panel_temp_bus
    # v3.2: pin each sensor by its 64-bit ROM address. Without this,
    # all three dallas_temp components default to the *first* sensor on
    # the bus and you get "Unable to select an address" warnings.
    # Addresses are baked at the factory; capture them from the bus
    # scan log (gpio.one_wire component prints them at boot).
    address: 0xb500000023e51028
    name: "Panel Temperature"
    id: panel_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 30s

  # NEW (v2.8): Soil temperature for frost protection. Waterproof probe,
  # 5cm depth. Used by frost automation (soil < 4°C → heater ON).
  - platform: dallas_temp
    one_wire_id: panel_temp_bus
    address: 0x5a00000023417028
    name: "Soil Temperature"
    id: soil_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s

  # NEW (v2.8): Canopy air temperature for frost + DLI sanity check.
  # Currently unwired (only 2 of 3 sensors on the bus) — will read
  # NaN until a third probe is added. Replace the placeholder address
  # below with the third sensor's address from the bus scan log.
  - platform: dallas_temp
    one_wire_id: panel_temp_bus
    address: 0x0000000000000000
    name: "Canopy Air Temperature"
    id: canopy_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
  - platform: adc
    # v3: schematic rev B places soil moisture on GPIO6 (was GPIO3).
    pin: GPIO6
    id: soil_moisture_raw
    name: "Soil Moisture (raw V)"
    attenuation: auto
    update_interval: 10s

  - platform: template
    id: soil_moisture_pct
    name: "Soil Moisture"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // Capacitive sensor: dry ~ 3.0V, wet ~ 1.0V. Calibrate in field.
      float v = id(soil_moisture_raw).state;
      if (isnan(v)) return NAN;
      float pct = (3.0 - v) / 2.0 * 100.0;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;

  # ===== v2.5: Solenoid diagnostics =====
  # Seconds since the solenoid was last turned on. 0 when off.
  # Useful in HA to see "watering for 47 s" without needing a timer.
  - platform: template
    id: solenoid_on_seconds
    name: "Solenoid On Time (s)"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(g_solenoid_on_since_ms) == 0) return 0;
      unsigned long on_since = id(g_solenoid_on_since_ms);
      unsigned long now = millis();
      // millis() overflow every ~49 days; handle wrap.
      unsigned long elapsed_ms;
      if (now >= on_since) {
        elapsed_ms = now - on_since;
      } else {
        elapsed_ms = (0xFFFFFFFFUL - on_since) + now + 1;
      }
      return (float)(elapsed_ms / 1000UL);

  # Effective water budget remaining (seconds). = max_on_time - elapsed.
  # Goes negative if the watchdog tripped. Shows in HA as "Budget: 213s".
  - platform: template
    id: solenoid_budget_sec
    name: "Solenoid Budget (s)"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(g_solenoid_on_since_ms) == 0) {
        return (float)id(solenoid_max_water_sec).state;
      }
      unsigned long on_since = id(g_solenoid_on_since_ms);
      unsigned long now = millis();
      unsigned long elapsed_ms = (now >= on_since)
          ? (now - on_since)
          : (0xFFFFFFFFUL - on_since) + now + 1;
      float budget = (float)id(solenoid_max_water_sec).state
                     - (float)(elapsed_ms / 1000UL);
      return budget;

  - platform: adc
    # v3: schematic rev B places battery V ADC on GPIO7 (was GPIO4). GPIO4 is
    # now the Motor IPROPI current-sense input.
    pin: GPIO7
    id: battery_v_raw
    name: "Battery Voltage (raw V)"
    attenuation: auto
    update_interval: 10s

  # ===== v3: Motor IPROPI (current sense) =====
  # DRV8871 IPROPI outputs a current proportional to the motor current,
  # scaled by the external sense resistor. With the 0.1 Ω shunt on U5a
  # (BOM §6) the voltage at IPROPI ≈ motor_current × 5 kΩ / 10 kΩ =
  # motor_current × 0.5 V/A. Used by the state machine to detect
  # end-stop arrival via current spike (replaces the limit switches
  # removed in schematic rev B).
  #
  # v3.2 logging fix: this pin and its derived current used to be
  # `name:`d (published to the API/MQTT/HA) at update_interval 100ms.
  # At 10 Hz that alone drove ~294 MB/day of MQTT log traffic (see
  # docs/logging.md, which budgets ~10 MB/day) — 29x over budget the
  # day these landed. The 100ms cadence is real and needed, but only
  # for the endstop-spike script below, not for a dashboard. Fix:
  # keep the fast path `internal: true` (still fully readable via
  # `id(...).state` from C++, just not published), and add a slower,
  # throttled, publicly-named sensor underneath for the API/HA/logs.
  - platform: adc
    pin: GPIO4
    id: motor_ipropi_raw
    internal: true
    update_interval: 100ms

  - platform: template
    id: motor_current_ipropi
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 100ms
    lambda: |-
      float v = id(motor_ipropi_raw).state;
      if (isnan(v)) return NAN;
      // IPROPI resistor: 5 kΩ internal. With 0.1 Ω shunt, A/V = 1/(0.1 × 5e3) = 2.0 A/V.
      // Invert: I = V / 0.5 = V × 2.0.
      float i = v * 2.0f;
      // v3.2: new ESP32-S3 chip (rev v0.2, MAC e0:72:a1:f5:aa:ec) has a
      // ~0.12 V ADC2 offset at 0 V input → ~0.24 A baseline on this pin.
      // Subtract to report real current. Clamp at 0 so the value never
      // goes negative.
      i -= 0.24f;
      if (i < 0.0f) i = 0.0f;
      return i;

  # Dashboard/API-facing copy of the above, at a sane publish rate.
  # Entity name is unchanged ("Motor IPROPI Current") so
  # tools/wattplot_control.py's ENTITY_KEYS map and docs/control.html
  # (which both key off this exact string) keep working untouched.
  - platform: template
    id: motor_current_ipropi_display
    name: "Motor IPROPI Current"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 2s
    lambda: return id(motor_current_ipropi).state;

  # ===== v3: Solenoid IPROPI (jam detect) =====
  # Same DRV8871 IPROPI feature, on U5b. A free-running irrigation
  # solenoid draws ~1.0 A continuous; a jammed one pulls ~1.5 A+ and
  # trips the DRV8871's internal current limit. Reading IPROPI lets the
  # state machine detect a stuck valve without waiting for nFAULT.
  # Same fast-internal / throttled-display split as the motor IPROPI
  # above, for the same logging-volume reason.
  - platform: adc
    pin: GPIO5
    id: solenoid_ipropi_raw
    internal: true
    update_interval: 100ms

  - platform: template
    id: solenoid_current_ipropi
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 100ms
    lambda: |-
      float v = id(solenoid_ipropi_raw).state;
      if (isnan(v)) return NAN;
      // v3.2: solenoid H-bridge (U5b) is normally off. When the valve is
      // closed, the IPROPI pin floats and ADC2 reads ~0.5 V of noise —
      // ~1 A in our conversion. Only report real current when the valve
      // is actually being driven. Same 0.24 A baseline offset as the
      // motor IPROPI (same ADC2 peripheral, same chip).
      if (!id(grow_light_relay).state) {
        return 0.0f;
      }
      float i = v * 2.0f - 0.24f;
      if (i < 0.0f) i = 0.0f;
      return i;

  # Dashboard/API-facing copy, entity name unchanged ("Solenoid IPROPI
  # Current") for the same reason as the motor sensor above.
  - platform: template
    id: solenoid_current_ipropi_display
    name: "Solenoid IPROPI Current"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 2s
    lambda: return id(solenoid_current_ipropi).state;

  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      // 100k/10k divider: V_adc = V_battery * 10/110
      // V_battery = V_adc * (100+10)/10 = V_adc * 11.0
      float v = id(battery_v_raw).state;
      if (isnan(v)) return NAN;
      return v * 11.0;

  # ===== INA219 #1 (U6a) — actuator current + 12V bus V =====
  # 0.1Ω shunt, 3.2A max, polled at 200ms. See the section comment
  # block at the top of the file for full context. Note the schema
  # style — `sensor: - platform: ina219` (the top-level `ina219:`
  # block was removed in ESPHome 2026.7.2).
  - platform: ina219
    i2c_id: i2c_main
    address: 0x40
    id: ina_motor
    shunt_resistance: 0.1Ω
    max_current: 3.2A
    update_interval: 200ms
    current:
      name: "Motor Current"
      id: motor_current
      unit_of_measurement: "A"
      accuracy_decimals: 3
      filters:
        - multiply: 0.001  # mA → A
    bus_voltage:
      name: "Actuator Bus V"
      id: actuator_bus_v
      unit_of_measurement: "V"
      accuracy_decimals: 2

  # ===== INA219 #2 (U6b) — panel V/I for energy monitor =====
  # 0.1Ω shunt, 1.0A max (ECO-WORTHY 10W panel peaks at ~0.6A),
  # polled at 1s. Used by `panel_power_w` to drive the 1Hz energy
  # integration.
  - platform: ina219
    i2c_id: i2c_main
    address: 0x41
    id: ina_panel
    shunt_resistance: 0.1Ω
    max_current: 1.0A
    update_interval: 1s
    current:
      name: "Panel Current"
      id: panel_current
      unit_of_measurement: "A"
      accuracy_decimals: 3
      filters:
        - multiply: 0.001  # mA → A
    bus_voltage:
      name: "Panel V"
      id: panel_v
      unit_of_measurement: "V"
      accuracy_decimals: 2

  # ===== v2.4: Energy + SOC + POA + Efficiency =====
  # Panel power (W) = panel V × panel I, both from the panel INA219
  # (U6b, I2C 0x41). NaN-guarded so a missing/broken INA219 doesn't
  # poison the energy integration (which short-circuits on NaN).
  - platform: template
    id: panel_power_w
    name: "Panel Power"
    unit_of_measurement: "W"
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      float v = id(panel_v).state;
      float i = id(panel_current).state;
      if (isnan(v) || isnan(i)) return NAN;
      // Sign convention: INA219 current is positive when the panel
      // is sourcing. If the polarity is reversed (we measured return
      // current), the result will be negative — clamp to 0.
      float p = v * i;
      if (p < 0) return 0;
      return p;

  # Battery SOC via LiFePO4 voltage lookup table (12V 4S, 13.6V=100% .. 10.5V=0%)
  - platform: template
    id: battery_soc
    name: "Battery SOC"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return NAN;
      // LiFePO4 voltage -> SOC lookup (interpolated)
      // 13.6V=100, 13.4=95, 13.3=90, 13.2=80, 13.0=60, 12.8=40, 12.5=20, 12.0=10, 10.5=0
      const float lut_v[] = {13.6, 13.4, 13.3, 13.2, 13.0, 12.8, 12.5, 12.0, 10.5};
      const float lut_s[] = { 100,   95,   90,   80,   60,   40,   20,   10,    0};
      if (v >= lut_v[0]) return 100;
      if (v <= lut_v[8]) return 0;
      for (int i = 0; i < 8; i++) {
        if (v >= lut_v[i+1] && v <= lut_v[i]) {
          return lut_s[i+1] + (lut_s[i] - lut_s[i+1]) *
                 (v - lut_v[i+1]) / (lut_v[i] - lut_v[i+1]);
        }
      }
      return 0;

  # POA irradiance (W/m^2) - Plane of Array, from solar position + tilt + clear-sky
  # Phoenix lat 33.45°N. Computes direct + diffuse on the tilted panel.
  - platform: template
    id: poa_irradiance
    name: "POA Irradiance"
    unit_of_measurement: "W/m²"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      // Get current time. Use ESPHome's time component or RTC.
      auto now = id(sntp_time).now();
      if (!now.is_valid()) return NAN;
      int doy = now.day_of_year;  // 1-365
      float hour = now.hour + now.minute / 60.0 + now.second / 3600.0;
      // Phoenix coordinates (33.45°N, -112.07°W, no DST)
      const float lat = 33.45 * M_PI / 180.0;
      // Solar declination
      float dec = 23.45 * sin((360.0 / 365.0) * (doy - 81) * M_PI / 180.0)
                  * M_PI / 180.0;
      // Civil → solar time conversion.
      // solar_time = civil_time - (observer_longitude - tz_central_meridian) / 15
      // For Phoenix (-112.07) on MST (tz meridian -105): correction
      // is -0.471 hours. Civil noon becomes solar_hour 11.529,
      // hour angle -7.07° (sun is east of meridian, crosses at
      // solar noon ~12:28 civil time — the "apparent solar noon"
      // for Phoenix's longitude). The Python reference used to live
      // in firmware/logic/sun.py:hour_angle_rad but that module
      // was removed (it was only used as a development-time cross-
      // check). The C++ lambda below IS the implementation; pvlib's
      // solarposition.get_solarposition() is the cross-check during
      // tuning. Keep the math here in sync with wattplot_params.
      // LOCATION['longitude'] / ['timezone'].
      const float lon_correction = (-112.07 - (-105.0)) / 15.0;
      float solar_hour = hour + lon_correction;
      float hour_angle = (solar_hour - 12.0) * 15.0 * M_PI / 180.0;
      // Solar altitude
      float sin_alt = sin(lat) * sin(dec) + cos(lat) * cos(dec) * cos(hour_angle);
      if (sin_alt <= 0.01) return 0;  // sun below horizon
      float altitude = asin(sin_alt);
      // Air mass (Kasten & Young)
      float am = 1.0 / (sin_alt + 0.50572 *
             pow(6.07995 + altitude * 180.0 / M_PI, -1.6364));
      // Clear-sky direct normal irradiance (Ineichen simplified)
      float dni = 1361.0 * pow(0.7, pow(am, 0.678));
      // Panel tilt (from runtime state)
      float tilt = id(panel_tilt).state * M_PI / 180.0;
      if (isnan(tilt)) tilt = 0;
      // For Phoenix south-facing panel, azimuth_sun ≈ 180° at noon,
      // panel_azimuth = 180°, so cos(aoi) ≈ cos(altitude - tilt).
      // Simplified aoi for south-facing panel:
      float aoi = fabs(altitude - tilt);
      if (aoi > M_PI / 2.0) return 0;
      float poa_direct = dni * cos(aoi);
      // Diffuse: isotropic sky model, ~10% of DNI as DHI
      float dhi = 0.10 * dni;
      float poa_diffuse = dhi * (1.0 + cos(tilt)) / 2.0;
      return poa_direct + poa_diffuse;

  # Panel efficiency = (V*I) / (POA * area) * 100
  # ECO-WORTHY 10W: 13.3" × 8.1" = 0.0695 m^2
  - platform: template
    id: panel_efficiency
    name: "Panel Efficiency"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float p = id(panel_power_w).state;
      float poa = id(poa_irradiance).state;
      if (isnan(p) || isnan(poa)) return NAN;
      if (poa < 50.0) return 0;  // noise floor at low light
      const float area_m2 = 13.3 * 8.1 * 0.00064516;  // in^2 to m^2
      return 100.0 * p / (poa * area_m2);

  # Energy total (lifetime, persists across reboots, capped at 10 MWh)
  - platform: template
    id: energy_total
    name: "Energy Total"
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      // Read from the persistent global (g_energy_total_kwh, restore_value: true)
      return id(g_energy_total_kwh);

  # Daily energy (reset at midnight)
  - platform: template
    id: energy_today
    name: "Energy Today"
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      static float today = 0;
      static int last_doy = -1;
      auto now = id(sntp_time).now();
      if (last_doy != now.day_of_year) {
        today = 0;
        last_doy = now.day_of_year;
      }
      return today;

  # Panel tilt from IMU (atan2 of accel) -- STUBBED for dry-run.
  # The bmi160 component is disabled in this ESPHome 2026.7.2 build
  # (see commented block above). Until the IMU is wired, panel_tilt
  # mirrors commanded_tilt -- the best estimate we have for actual tilt.
  # Control loop + POA calc treat this the same way. Logged at 1s
  # (was 100ms) to keep the log file sane -- dashboard sparkline
  # still looks great at 1s.
  - platform: template
    name: "Panel Tilt"
    id: panel_tilt
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      if (id(commanded_tilt).has_state()) {
        return id(commanded_tilt).state;
      }
      return 0.0;

  # WiFi signal strength (RSSI in dBm, negative). Built-in ESPHome sensor.
  # Useful as a connectivity health signal — when the panel is mounted in
  # the field, a fading RSSI is the first warning of antenna/alignment issues.
  # Range: typically -30 dBm (excellent) to -90 dBm (unreliable). 60s poll.
  - platform: wifi_signal
    name: "WiFi Signal"
    id: rssi
    update_interval: 60s

  # ===== v3.2: Diagnostic sensors =====
  # These are the "is the device healthy" readouts. All surface in HA
  # and are logged via MQTT so the log_subscriber.py can graph them.
  - platform: uptime
    name: "Uptime"
    id: wp_uptime
    update_interval: 30s
  - platform: internal_temperature
    name: "MCU Temperature"
    id: wp_mcu_temp
    update_interval: 60s
  - platform: template
    name: "Free Memory"
    id: wp_free_heap
    unit_of_measurement: "bytes"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return ESP.getFreeHeap();'

  # ===== v3.2: Calibration age =====
  # Seconds since the last completed actuator_calibrate run. 0 means
  # never calibrated. Surfaces as "Last Calibration (s)" in HA so you
  # can tell at a glance whether the wattplot knows its endstops.
  - platform: template
    name: "Last Calibration (s)"
    id: last_calibration_sec
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      unsigned long last = id(g_last_calibration_ms);
      if (last == 0) return 0.0f;
      return (millis() - last) / 1000.0f;
  # ===== v3.2: Endstop stall currents (from last calibration) =====
  # IPROPI current (A) recorded at the moment each endstop was hit.
  # Asymmetric values can indicate mechanical asymmetry (one end has
  # a hard stop, the other a soft cushion or a slightly bent link).
  - platform: template
    name: "Last MAX Endstop Current"
    id: last_calib_extend_a
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 30s
    lambda: |-
      return id(g_calib_extend_a);
  - platform: template
    name: "Last ZERO Endstop Current"
    id: last_calib_retract_a
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 30s
    lambda: |-
      return id(g_calib_retract_a);

# ===== v3.2: Text sensors (free-form strings) =====
# Last Event is a rolling one-line summary of the most recent thing
# the wattplot did (state change, fault, solenoid on/off, calibration).
# Updated from many places: state_to_*, nFAULT automation, solenoid
# switch turn_on/off, calibration script, etc.
# Note: WiFi IP / SSID / MAC aren't exposed as text_sensors because
# the wifi_info platform doesn't exist in ESPHome 2026.7.2 and the
# wifi singleton isn't reachable from a template lambda. Use the
# ESPHome web UI on port 80 for those.
text_sensor:
  - platform: template
    name: "Last Event"
    id: wp_last_event
    update_interval: 1s
    lambda: 'return id(g_last_event);'

# ===== DRV8871 nFAULT inputs (direct GPIO, no MCP23017) =====
binary_sensor:
  # v3: schematic rev B routes nFAULT directly to GPIO. The MCP23017
  # expander is gone from the BOM.
  #
  # U5a (actuator) nFAULT → GPIO21: open-drain, pulled HIGH by 10kΩ to 3V3.
  # Goes LOW when the DRV8871's internal current limiter trips (motor
  # stall against the end-stop block or a hard short) or on thermal
  # shutdown. Polled at 100 ms with 10 ms debounce.
  - platform: gpio
    id: actuator_nfault
    name: "Actuator nFAULT"
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        - lambda: |-
            // nFAULT rising edge (LOW → HIGH after debounce means
            // the fault cleared) is the normal "released" event —
            // no action. The `on_state` automation below handles
            // the LOW event (fault active).
            ESP_LOGW("nfault", "Actuator nFAULT cleared (recovered)");
    on_state:
      then:
        - lambda: |-
            // The platform reports the *current* state on each poll.
            // We only care about the LOW edge (state == false).
            if (x) return;  // x=true means HIGH = no fault
            id(g_actuator_fault_count) = id(g_actuator_fault_count) + 1;
            ESP_LOGE("nfault", "Actuator nFAULT LOW (count=%d) — stopping",
                     id(g_actuator_fault_count));
            char buf[80];
            snprintf(buf, sizeof(buf),
                     "Actuator nFAULT (count=%d) up=%us",
                     id(g_actuator_fault_count),
                     (unsigned)(millis()/1000));
            id(g_last_event) = buf;
            id(actuator_stop).execute();
            // If the fault persists > 2 s the 1 Hz control loop's
            // `i_motor > i_safe_limit + 0.3` check will trigger
            // `state_to_folding` automatically. This immediate stop
            // is the fast path.

  # U5b (solenoid) nFAULT → GPIO13: open-drain, pulled HIGH by 10kΩ to 3V3.
  # Goes LOW when the solenoid draws > 1.5 A (jammed, partial short)
  # or on thermal shutdown. Latches the alarm — user must clear
  # `solenoid_fault_alarm` (HA) or cycle Auto → Off → Auto to retry.
  - platform: gpio
    id: solenoid_nfault
    name: "Solenoid nFAULT"
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        - lambda: |-
            ESP_LOGW("nfault", "Solenoid nFAULT cleared (recovered)");
    on_state:
      then:
        - lambda: |-
            if (x) return;  // HIGH = no fault
            id(g_solenoid_alarm) = true;
            id(g_solenoid_fault_count) = id(g_solenoid_fault_count) + 1;
            ESP_LOGE("nfault", "Solenoid nFAULT LOW (count=%d) — forcing off",
                     id(g_solenoid_fault_count));
            // Force the solenoid off regardless of mode. Use the
            // switch's optimistic turn_off to also reflect OFF in HA.
            id(grow_light_relay).turn_off();

  # ===== v2.5: Latched fault alarm (virtual) =====
  # Mirrors the g_solenoid_alarm global. Cleared by turning the
  # solenoid off in any mode (the switch's turn_off_action handles
  # the reset, see switch: section).
  - platform: template
    id: solenoid_fault_alarm
    name: "Solenoid Fault Alarm"
    icon: "mdi:alert-circle"
    lambda: |-
      return id(g_solenoid_alarm);

  # ===== v3.2: Calibration status =====
  # Mirrors g_calibration_running. Lights up while the actuator_calibrate
  # script is driving the H-bridge; lets HA show a "calibrating" badge
  # and prevents users from triggering conflicting actions.
  - platform: template
    id: calibration_in_progress
    name: "Calibration In Progress"
    icon: "mdi:tune-vertical"
    lambda: |-
      return id(g_calibration_running);

# ===== Solenoid (U5b DRV8871 — water / latch subsystem) =====
# K1=A evolved to U5b: a second DRV8871 in single-direction H-bridge mode
# drives the 12V irrigation solenoid (IN1=GPIO7, IN2=GPIO9, nSLEEP tied
# high on the board via 100kΩ — always enabled). The actuator H-bridge
# switches (U5a) defined below are for the panel-tilt actuator only; they
# remain independent manual-control / diagnostic switches and do NOT
# touch the solenoid.
# See hardware/BOM.md §7.
switch:
  - platform: template
    # ---- Solenoid (U5b) ----
    # U5b DRV8871: drives IN1+IN2 atomically so the solenoid can never
    # be left in an invalid state (e.g. IN1=IN2=HIGH is brake, fine, but
    # we keep it simple: ON = IN1 H / IN2 L; OFF = both L = coast).
    # Internal id kept as grow_light_relay to preserve Home Assistant
    # retained state across the entity rename.
    id: grow_light_relay
    name: "Solenoid Valve"
    icon: "mdi:water-pump"
    restore_mode: RESTORE_DEFAULT_OFF
    # Optimistic: there is no input we can read back from the DRV8871 to
    # confirm state, so the framework trusts the turn_on/off action and
    # publishes the requested state immediately.
    optimistic: true
    # State is tracked by ESPHome's template switch from the actions below
    # (no explicit lambda needed — outputs are only driven via these actions).
    turn_on_action:
      - lambda: |-
          id(g_solenoid_on_since_ms) = millis();
          float v = id(battery_voltage).state;
          char buf[96];
          snprintf(buf, sizeof(buf),
                   "Solenoid ON (V_batt=%.2fV up=%us)",
                   isnan(v) ? -1.0f : v,
                   (unsigned)(millis()/1000));
          id(g_last_event) = buf;
          ESP_LOGI("solenoid", "%s", buf);
      - output.turn_on: solenoid_in1_out
      - output.turn_off: solenoid_in2_out
    turn_off_action:
      # Clear the on-timestamp so the next turn-on starts the watchdog
      # from zero, and clear the latched fault alarm (user acknowledged).
      - lambda: |-
          unsigned long on_since = id(g_solenoid_on_since_ms);
          unsigned long dur_ms = on_since ? (millis() - on_since) : 0;
          id(g_solenoid_on_since_ms) = 0;
          id(g_solenoid_alarm) = false;
          char buf[96];
          snprintf(buf, sizeof(buf),
                   "Solenoid OFF (was on %ums) up=%us",
                   (unsigned)dur_ms,
                   (unsigned)(millis()/1000));
          id(g_last_event) = buf;
          ESP_LOGI("solenoid", "%s", buf);
      - output.turn_off: solenoid_in1_out
      - output.turn_off: solenoid_in2_out

  - platform: output
    id: hb_in1_sw
    name: "Actuator H-bridge IN1 (U5a)"
    output: hb_in1_out
  - platform: output
    id: hb_in2_sw
    name: "Actuator H-bridge IN2 (U5a)"
    output: hb_in2_out
  - platform: output
    id: hb_en_sw
    name: "Actuator H-bridge EN (U5a)"
    output: hb_en_out

# ===== Globals (persistent state) =====
# (Merged into the main globals: section below)

# ===== Configurable parameters =====
number:
  - platform: template
    id: target_current
    name: "Target Current (A)"
    min_value: 0.0
    max_value: 2.0
    step: 0.05
    initial_value: "0.5"
    optimistic: true
    restore_value: true

  - platform: template
    id: i_safe
    name: "I Safe (A)"
    min_value: 1.0
    max_value: 3.0
    step: 0.1
    initial_value: "2.5"
    optimistic: true
    restore_value: true

  - platform: template
    id: deadband_a
    name: "Current Deadband (A)"
    min_value: 0.05
    max_value: 0.5
    step: 0.05
    initial_value: "0.15"
    optimistic: true
    restore_value: true

  - platform: template
    id: commanded_tilt
    name: "Commanded Tilt (°)"
    min_value: 0
    # STRUCTURAL CAP: 35° max. The wind analysis (analysis/wind_load_report.md)
    # passes SF >= 2.0 only up to 35° tilt (panel on 72" posts); 45° and above
    # fail overturning. Do not raise without re-running the wind calc.
    max_value: 35
    step: 5
    initial_value: "35"
    optimistic: true
    restore_value: true

  - platform: template
    id: kp_value
    name: "Kp (deg per A)"
    min_value: 0.0
    max_value: 10.0
    step: 0.1
    initial_value: "2.0"
    optimistic: true
    restore_value: true

  - platform: template
    id: ki_value
    name: "Ki (deg per (A·s))"
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    initial_value: "0.10"
    optimistic: true
    restore_value: true

  - platform: template
    id: max_step_per_sec
    name: "Max Step (° per s)"
    min_value: 0.5
    max_value: 10.0
    step: 0.5
    initial_value: "3.0"
    optimistic: true
    restore_value: true

  # ===== v2.5: Solenoid safety =====
  # Max continuous on-time. If exceeded, the solenoid is force-off
  # regardless of mode. Protects against a shorted soil sensor or
  # stuck automation that would otherwise run the solenoid forever.
  # 300 s = 5 min default. Range: 30 s (1 tick) to 1800 s (30 min).
  - platform: template
    id: solenoid_max_water_sec
    name: "Solenoid Max On-Time (s)"
    min_value: 30
    max_value: 1800
    step: 30
    initial_value: "300"
    optimistic: true
    restore_value: true

  # Battery floor for irrigation. Below this V_batt, the solenoid is
  # forced off to protect the LiFePO4 4S from deep discharge. The
  # 11.5 V default corresponds to roughly 20% SOC; the MPPT will
  # still recover the pack once the panel catches up.
  - platform: template
    id: battery_water_floor_v
    name: "Solenoid Battery Floor (V)"
    min_value: 10.5
    max_value: 13.0
    step: 0.1
    initial_value: "11.5"
    optimistic: true
    restore_value: true

  # ===== v2.5: One-off watering duration =====
  # Used by the "Water Now" button. Default 5 s, capped at the
  # max-on-time (solenoid_max_water_sec) at runtime.
  - platform: template
    id: one_off_water_sec
    name: "One-Off Water Duration (s)"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: "5"
    optimistic: true
    restore_value: true

  # ===== v3.1: Endstop current threshold =====
  # Motor current (A) above which we consider the actuator to have hit
  # an endstop. Tune in the field: above normal run current (~0.5 A),
  # below stall current (DRV8871 ITRIP ~1.15 A = ~0.58 V at IPROPI
  # v3.2: with the new IPROPI baseline subtraction (0.24 A on this
  # chip), the actuator's running current is ~0.84 A and the endstop
  # stall current is ~1.0 A. The threshold has to sit *between* those
  # to distinguish real endstops from normal motion — so 0.90 A
  # default, tight ~0.06 A margin on each side. If the running
  # current changes (different actuator, different chip), adjust this
  # in HA. Original (v3.1) was 0.80 A over a 200 ms window, which
  # was tuned to a different actuator's current signature.
  - platform: template
    id: endstop_current_threshold
    name: "Endstop Current Threshold (A)"
    min_value: 0.3
    max_value: 2.0
    step: 0.01
    initial_value: "0.90"
    optimistic: true
    restore_value: false

# ===== State machine =====
select:
  - platform: template
    id: controller_state
    name: "Controller State"
    options:
      - "Normal"
      - "Monitoring"
      - "Folding"
      - "Locked"
    initial_option: "Folding"   # safe default
    optimistic: true
    restore_value: true

  - platform: template
    id: controller_mode
    name: "Controller Mode"
    options:
      - "Power"   # 35° tilt, max kWh
      # "BedSun" (90° vertical) RETIRED: fails the wind calc at design wind
      # (SF_overturning 1.26 at 90°). Structural max is 35°.
      # For full bed sun, stow flat (0°) instead - panel shades nothing.
    initial_option: "Power"
    optimistic: true
    restore_value: true

  - platform: template
    # Select drives the irrigation solenoid (U5b DRV8871) automation:
    #   Off    = never water (solenoid forced off)
    #   Auto   = water when soil moisture drops below threshold
    #   Manual = user controls the solenoid via the Solenoid Valve switch
    id: grow_light_mode
    name: "Solenoid Mode"
    options:
      - "Off"
      - "Auto"
      - "Manual"
    initial_option: "Off"
    optimistic: true
    restore_value: true

# ===== v2.5: One-off watering button =====
# "Water Now" — triggers the `one_off_water` script which drives the
# solenoid for `one_off_water_sec` seconds (default 5), respecting the
# same safety guards as auto mode (alarm, battery, state). Independent
# of `Solenoid Mode` — works in Off, Auto, or Manual.
#
# For ad-hoc "manual" watering use the existing `Solenoid Valve` switch
# (set `Solenoid Mode` to `Manual` first, then toggle the switch). This
# button is for *timed* one-shots.
button:
  - platform: template
    id: one_off_water_btn
    name: "Water Now"
    icon: "mdi:watering-can"
    on_press:
      - script.execute: one_off_water
  # v3.2: actuator self-calibration. Runs ~35-45 s; can be triggered
  # any time the battery is connected. Idempotent: a second press
  # restarts the script (mode: restart) which resets the global flags.
  - platform: template
    id: calibrate_actuator_btn
    name: "Calibrate Actuator"
    icon: "mdi:tune-vertical"
    on_press:
      - script.execute: actuator_calibrate

# ===== Globals (control state) =====
globals:
  - id: g_integral
    type: float
    initial_value: "0.0"
    restore_value: false
  - id: g_nws_max_wind_mph
    type: float
    initial_value: "0.0"
    restore_value: false
  - id: g_nws_rain_forecast
    type: bool
    initial_value: "false"
    restore_value: false
  - id: g_nws_last_poll_ms
    type: int
    initial_value: "0"
    restore_value: false
  - id: g_state_entered_ms
    type: int
    initial_value: "0"
    restore_value: false
  - id: g_monitoring_countdown_ms
    type: int
    initial_value: "0"
    restore_value: false
  - id: g_locked_countdown_ms
    type: int
    initial_value: "0"
    restore_value: false
  - id: g_daily_dli_mol
    type: float
    initial_value: "0.0"
    restore_value: false
  - id: g_dli_target_mol
    type: float
    initial_value: "20.0"
    restore_value: true
  # ===== v2.4: Watering + energy monitoring state =====
  - id: watering_auto_enabled
    type: bool
    initial_value: "true"
    restore_value: true
  - id: watering_events_today
    type: int
    initial_value: "0"
    restore_value: false
  - id: water_ml_today
    type: float
    initial_value: "0.0"
    restore_value: false
  - id: is_night_flag
    type: bool
    initial_value: "false"
    restore_value: false
  - id: g_energy_total_kwh
    type: float
    initial_value: "0.0"
    restore_value: true
  # ===== v2.5: Solenoid + actuator fault state =====
  # When the solenoid was last turned on. Used by the max-on-time
  # watchdog. 0 = solenoid is currently off.
  - id: g_solenoid_on_since_ms
    type: int
    initial_value: "0"
    restore_value: false
  # Latched alarm. Set true by a solenoid nFAULT event; cleared by
  # the user turning the solenoid off (Manual or Off mode).
  - id: g_solenoid_alarm
    type: bool
    initial_value: "false"
    restore_value: false
  # Fault counts — surfaced as sensors for visibility.
  - id: g_solenoid_fault_count
    type: int
    initial_value: "0"
    restore_value: false
  - id: g_actuator_fault_count
    type: int
    initial_value: "0"
    restore_value: false
  # v3.2: rolling "last event" string. Updated by the 1Hz control loop,
  # calibration script, fault automations, and solenoid on/off. The
  # `Last Event` template sensor mirrors it. Free-form human-readable.
  - id: g_last_event
    type: std::string
    initial_value: '"boot"'
    restore_value: false
  # ===== v3.2: Actuator self-calibration state =====
  # Set to true while the calibrate_actuator script is running. The 1 Hz
  # control loop checks this flag and steps back, so the calibration
  # script can drive the H-bridge without the loop fighting it.
  - id: g_calibration_running
    type: bool
    initial_value: "false"
    restore_value: false
  # Timestamp of the last completed calibration. 0 = never.
  - id: g_last_calibration_ms
    type: int
    initial_value: "0"
    restore_value: false
  # Internal — millis() when the current calibration run started. Used
  # by the calibrate_actuator script's while-loops to enforce timeouts.
  - id: g_calib_started_ms
    type: int
    initial_value: "0"
    restore_value: false
  # Internal — milliseconds from start of calibration to MAX endstop hit.
  # Recorded for diagnostic visibility; not used by the state machine.
  - id: g_calib_extend_ms
    type: int
    initial_value: "0"
    restore_value: false
  # Internal — milliseconds from start of calibration to ZERO endstop hit.
  - id: g_calib_retract_ms
    type: int
    initial_value: "0"
    restore_value: false
  # IPROPI current (A) measured at the moment each endstop was hit
  # during the last calibration. Lets us see if the two endstops have
  # meaningfully different stall currents — a sign of asymmetric
  # mechanics (e.g. one end has a hard stop, the other has a soft
  # cushion or a slightly bent link).
  - id: g_calib_extend_a
    type: float
    initial_value: "0.0"
    restore_value: false
  - id: g_calib_retract_a
    type: float
    initial_value: "0.0"
    restore_value: false
  # Track when the actuator's nFAULT last cleared, for the
  # "fault-persists-too-long → fold" decision.
  - id: g_actuator_fault_since_ms
    type: int
    initial_value: "0"
    restore_value: false
  # One-off watering duration in ms (set by the one_off_water script,
  # read by the `delay:` action). 0 when not active.
  - id: g_one_off_dur_ms
    type: int
    initial_value: "0"
    restore_value: false

  # ===== v3.1: Current-based endstop state =====
  # Schematic rev B removed the physical limit switches and uses the
  # DRV8871's motor current spike (via Motor IPROPI, GPIO4) to detect
  # when the actuator hits an endstop. The endpoint_detector interval
  # below watches i_motor_ipropi and sets these flags. The 1 Hz control
  # loop reads them in place of the old limit switch binary_sensors.
  #
  # g_at_zero  : true when the actuator is fully retracted (at 0°).
  # g_at_max   : true when the actuator is fully extended (at 35°).
  #             Both are reset by driving in the opposite direction;
  #             the spike detector sets exactly one of them.
  - id: g_at_zero
    type: bool
    initial_value: "false"
    restore_value: false
  - id: g_at_max
    type: bool
    initial_value: "false"
    restore_value: false
  # Last time we saw an endstop hit. Used by on-boot re-homing to
  # know if calibration is stale (e.g. after a long power-down).
  - id: g_endstop_last_hit_ms
    type: int
    initial_value: "0"
    restore_value: false

# ===== Scripts (actuator + state transitions + side-effects) =====
script:
  - id: actuator_extend
    mode: restart
    then:
      - switch.turn_on: hb_in1_sw
      - switch.turn_off: hb_in2_sw
      - switch.turn_on: hb_en_sw
      - light.turn_on:
          id: status_led
          brightness: 80%

  - id: actuator_retract
    mode: restart
    then:
      - switch.turn_off: hb_in1_sw
      - switch.turn_on: hb_in2_sw
      - switch.turn_on: hb_en_sw
      - light.turn_on:
          id: status_led
          brightness: 80%

  - id: actuator_stop
    mode: restart
    then:
      - switch.turn_off: hb_in1_sw
      - switch.turn_off: hb_in2_sw
      - switch.turn_off: hb_en_sw
      - light.turn_on:
          id: status_led
          brightness: 60%

  - id: state_to_normal
    then:
      - select.set:
          id: controller_state
          option: "Normal"
      - lambda: |-
          id(g_state_entered_ms) = millis();
          char buf[80];
          snprintf(buf, sizeof(buf), "-> Normal (up=%us)",
                   (unsigned)(millis()/1000));
          id(g_last_event) = buf;
          ESP_LOGI("state", "%s", buf);
      - light.turn_on:
          id: status_led
          brightness: 70%

  - id: state_to_monitoring
    then:
      - select.set:
          id: controller_state
          option: "Monitoring"
      - lambda: |-
          id(g_state_entered_ms) = millis();
          id(g_monitoring_countdown_ms) = 0;
          char buf[80];
          snprintf(buf, sizeof(buf), "-> Monitoring (up=%us)",
                   (unsigned)(millis()/1000));
          id(g_last_event) = buf;
          ESP_LOGW("state", "%s", buf);
      - light.turn_on:
          id: status_led
          brightness: 70%

  - id: state_to_folding
    then:
      - select.set:
          id: controller_state
          option: "Folding"
      - lambda: |-
          id(g_state_entered_ms) = millis();
          char buf[80];
          snprintf(buf, sizeof(buf), "-> Folding (up=%us)",
                   (unsigned)(millis()/1000));
          id(g_last_event) = buf;
          ESP_LOGW("state", "%s", buf);
      - script.execute: actuator_retract
      - light.turn_on:
          id: status_led
          brightness: 90%

  - id: state_to_locked
    then:
      - select.set:
          id: controller_state
          option: "Locked"
      - lambda: |-
          id(g_state_entered_ms) = millis();
          id(g_locked_countdown_ms) = 0;
          char buf[80];
          snprintf(buf, sizeof(buf), "-> Locked (up=%us at_zero=%d at_max=%d)",
                   (unsigned)(millis()/1000),
                   (int)id(g_at_zero), (int)id(g_at_max));
          id(g_last_event) = buf;
          ESP_LOGI("state", "%s", buf);
      - script.execute: actuator_stop
      - light.turn_on:
          id: status_led
          brightness: 60%

  # ===== v3.2: Actuator self-calibration =====
  # Drives the actuator through its full range to find both endstops,
  # using the IPROPI current-spike detection (3 s sustained, set in
  # endpoint_detector). Total runtime is at least 30 s — each direction
  # needs 3 s of stall confirmation plus a long settle so we can be sure
  # the spike wasn't a transient load. With a fast actuator the routine
  # typically runs ~30-32 s; with a slow one it tops out at ~38 s.
  #
  # Sequence:
  #   1. Mark calibration running, set g_at_zero/g_at_max false.
  #   2. Drive EXTEND. Wait for g_at_max (3 s sustained spike).
  #      - 15 s hard timeout per direction.
  #   3. Stop, hold at MAX for 12 s settle.
  #   4. Drive RETRACT. Wait for g_at_zero.
  #   5. Stop, hold at ZERO for 12 s settle.
  #   6. Record g_last_calibration_ms, transition to Folding (which
  #      immediately Locked since at_zero is true).
  #
  # The 1 Hz control loop sees g_calibration_running=true and steps
  # back, so it doesn't try to drive the actuator to the commanded
  # tilt while we're calibrating.
  - id: actuator_calibrate
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("calib", "=== actuator self-calibration starting ===");
          id(g_calibration_running) = true;
          id(g_at_zero) = false;
          id(g_at_max) = false;
          id(g_calib_started_ms) = millis();
          id(g_calib_extend_ms) = 0;
          id(g_calib_retract_ms) = 0;
          id(g_calib_extend_a) = 0.0f;
          id(g_calib_retract_a) = 0.0f;

      # === Phase 1: drive to MAX (extended) ===
      - script.execute: actuator_extend
      - while:
          condition:
            lambda: |-
              return !id(g_at_max) &&
                     (millis() - id(g_calib_started_ms) < 15000);
          then:
            - delay: 200ms
      - script.execute: actuator_stop
      - lambda: |-
          if (id(g_at_max)) {
            id(g_calib_extend_ms) = millis() - id(g_calib_started_ms);
            // Current was captured by the endpoint_detector at the
            // moment of detection (before the H-bridge turned off and
            // IPROPI decayed). Don't overwrite here.
            ESP_LOGI("calib", "MAX endstop confirmed at %u ms (i=%.2f A)",
                     (unsigned)id(g_calib_extend_ms),
                     id(g_calib_extend_a));
          } else {
            ESP_LOGW("calib", "MAX endstop NOT detected (15s timeout)");
          }
      - delay: 12s  # hold at MAX, then back off and let IPROPI settle

      # === Phase 2: drive to ZERO (retracted) ===
      # Arm the detector for the retract direction.
      - lambda: |-
          id(g_at_zero) = false;
      - script.execute: actuator_retract
      - while:
          condition:
            lambda: |-
              // 15 s for Phase 2 drive (after Phase 1's 15 s + 12 s settle = 27 s).
              // Total budget 42 s from script start.
              return !id(g_at_zero) &&
                     (millis() - id(g_calib_started_ms) < 42000);
          then:
            - delay: 200ms
      - script.execute: actuator_stop
      - lambda: |-
          if (id(g_at_zero)) {
            id(g_calib_retract_ms) = millis() - id(g_calib_started_ms);
            // Current was captured by the endpoint_detector (see
            // g_calib_extend_a comment).
            ESP_LOGI("calib", "ZERO endstop confirmed at %u ms (i=%.2f A)",
                     (unsigned)id(g_calib_retract_ms),
                     id(g_calib_retract_a));
          } else {
            ESP_LOGW("calib", "ZERO endstop NOT detected (15s timeout)");
          }
      - delay: 12s  # settle at zero

      # === Wrap up ===
      - lambda: |-
          unsigned long total = millis() - id(g_calib_started_ms);
          ESP_LOGI("calib", "=== calibration complete (took %lu ms) ===",
                   total);
          id(g_calibration_running) = false;
          id(g_last_calibration_ms) = millis();

      # Return to Folding → Locked (since at_zero is now true). The
      # select.set doesn't trigger state_to_folding, but the 1 Hz loop
      # will see the state and immediately call state_to_locked because
      # g_at_zero is set.
      - select.set:
          id: controller_state
          option: "Folding"

  # NWS forecast poll
  # nws_poll DISABLED for dry-run validation: requires http_request component
  # which is not declared at the top level. The YAML must include:
  #   http_request:
  #     useragent: "WattplotController/1.0"
  #     timeout: 8s
  # Plus the web_server_base component may need to be added for the NWS API.
  - id: nws_poll
    mode: single
    then:
      - http_request.get:
          url: "https://api.weather.gov/gridpoints/PSR/153,87/forecast"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  // ESPHome 2026.7: on_response passes (response, body).
                  // 'body' is a std::string_ref; parse it ourselves via
                  // json::parse_json. The previous API auto-injected `root`,
                  // which is gone.
                  json::parse_json(body, [](JsonObject root) -> bool {
                    float max_wind = 0.0;
                    bool rain = false;
                    for (int i = 0; i < 12 && i < root["properties"]["periods"].size(); i++) {
                      const char* ws = root["properties"]["periods"][i]["windSpeed"];
                      const char* fc = root["properties"]["periods"][i]["shortForecast"];
                      if (ws != nullptr) {
                        // parse "15 mph" or "15 to 25 mph"
                        float v = atof(ws);
                        if (v > max_wind) max_wind = v;
                      }
                      if (fc != nullptr && (strstr(fc, "Rain") != nullptr || strstr(fc, "Showers") != nullptr)) {
                        rain = true;
                      }
                    }
                    id(g_nws_max_wind_mph) = max_wind;
                    id(g_nws_rain_forecast) = rain;
                    id(g_nws_last_poll_ms) = millis();
                    ESP_LOGI("nws", "max wind=%.0f mph, rain=%d", max_wind, rain);
                    return true;
                  });

  # Compute today's natural DLI from sun position + GHI (rough)
  - id: update_dli_estimate
    mode: single
    then:
      - lambda: |-
          // Rough daily DLI: integrate today's expected GHI between sunrise and sunset.
          // For v1 we estimate: DLI_daily = GHI_daily * 0.45_PAR * 3600s/hr * 8 hrs * (mol/J conversion)
          // Use the sun component to get today's max solar elevation (rough proxy for day length).
          // For Phoenix summer: ~50 mol/m2/day. For winter: ~25.
          // v1 uses a lookup based on month:
          int m = id(sntp_time).now().month;
          float est;
          if (m == 12 || m == 1 || m == 2) est = 22.0;       // winter
          else if (m == 3 || m == 4 || m == 10 || m == 11) est = 35.0;  // shoulder
          else if (m == 5 || m == 9) est = 42.0;            // spring/fall
          else est = 45.0;                                   // summer
          id(g_daily_dli_mol) = est;
          ESP_LOGI("dli", "Estimated natural DLI: %.0f mol/m²/day", est);

  # ===== v2.5: One-off watering =====
  # Triggered by the "Water Now" button. Safety check: alarm only.
  # The auto-tick (grow_light_tick) keeps the battery-floor check;
  # the one-off button is a manual override and is therefore more
  # permissive — the user explicitly asked for water, and they're at
  # the bench with a known-good power supply. Capped at
  # solenoid_max_water_sec at runtime.
  #
  # NOTE: the Folding/Locked state interlock is intentionally NOT
  # applied here. The auto-tick (grow_light_tick) refuses to water
  # during a wind-event state, but a manual button press is an
  # explicit user override — they want water regardless.
  - id: one_off_water
    mode: restart  # pressing the button again mid-water restarts the timer
    then:
      - lambda: |-
          if (id(g_solenoid_alarm)) {
            ESP_LOGW("solenoid", "one-off: alarm latched, skipped");
            return;
          }
          int dur_ms = (int)(id(one_off_water_sec).state * 1000.0f);
          int max_ms = (int)(id(solenoid_max_water_sec).state * 1000.0f);
          if (dur_ms > max_ms) {
            ESP_LOGW("solenoid", "one-off: %dms capped to %dms (max-on-time)",
                     dur_ms, max_ms);
            dur_ms = max_ms;
          }
          id(g_one_off_dur_ms) = dur_ms;
          ESP_LOGI("solenoid", "one-off: water for %dms", dur_ms);
      - switch.turn_on: grow_light_relay
      - delay: !lambda 'return id(g_one_off_dur_ms);'
      - switch.turn_off: grow_light_relay
      - lambda: |-
          ESP_LOGI("solenoid", "one-off: done");
          id(g_one_off_dur_ms) = 0;

# ===== Intervals =====
interval:
  - interval: 1s
    id: control_loop
    then:
      - lambda: |-
          // === 1 Hz main control loop ===
          // Implements the state machine + PI controller from docs/control_law.md
          // ESPHome 2026.7: Select no longer exposes `.state`; use `.current_option()`.
          // Also: the local was named `i_safe` and shadowed the global `i_safe`
          // TemplateNumber, breaking the id() macro resolution. Renamed to
          // `i_safe_limit` (local) vs `i_safe` (global).
          // v3.2: when actuator self-calibration is running, the calibrate
          // script owns the H-bridge. The 1 Hz loop must step back or it
          // will fight the calibration by trying to drive the actuator to
          // the commanded tilt.
          if (id(g_calibration_running)) {
            return;
          }
          const char* state = id(controller_state).current_option().c_str();
          // v2.5: read motor current from INA219 (U6a, 0x40, 0.1Ω shunt,
          // 200 ms poll). NaN-guard for the first few seconds after boot
          // before the I2C read lands.
          float i_motor = id(motor_current).state;
          if (isnan(i_motor)) i_motor = 0.0;  // treat NaN as 0A, not Infinity
          // v2.5: actuator nFAULT persistence check. The DRV8871's
          // internal current limit (ITRIP ~1.15A) trips before INA219
          // sees a real overcurrent on the wire. The on_state automation
          // already stops the actuator on the rising edge; here we check
          // persistence (> 2 s) and trigger a fold.
          if (id(actuator_nfault).state) {  // true = fault active (LOW)
            if (id(g_actuator_fault_since_ms) == 0) {
              id(g_actuator_fault_since_ms) = millis();
            } else {
              unsigned long fault_elapsed = millis() - id(g_actuator_fault_since_ms);
              if (fault_elapsed > 2000 &&
                  strcmp(state, "Folding") != 0 &&
                  strcmp(state, "Locked") != 0) {
                ESP_LOGE("control", "Actuator nFAULT persistent > 2s — folding");
                id(g_actuator_fault_count) = id(g_actuator_fault_count) + 1;
                id(state_to_folding).execute();
                return;
              }
            }
          } else {
            id(g_actuator_fault_since_ms) = 0;
          }
          float tilt_actual = id(panel_tilt).state;
          float i_safe_limit = id(i_safe).state;
          // v3.1: limits come from current-spike detection (g_at_zero / g_at_max),
          // not physical switches. The endpoint_detector interval sets these.
          bool at_zero = id(g_at_zero);
          bool at_ninety = id(g_at_max);

          // ----- Hard current limit → emergency fold -----
          if (i_motor > i_safe_limit + 0.3) {
            // Above hard limit, override everything
            if (strcmp(state, "Folding") != 0) {
              id(state_to_folding).execute();
            }
            return;  // skip the rest of the loop
          }

          // ----- State machine transitions -----
          if (strcmp(state, "Normal") == 0) {
            // NORMAL: PI loop. Trigger MONITORING if current > 0.5 * i_safe
            if (i_motor > 0.5 * i_safe_limit) {
              id(state_to_monitoring).execute();
            } else {
              // Run PI loop
              float setpoint = id(target_current).state;
              float deadband = id(deadband_a).state;
              float error = i_motor - setpoint;
              if (fabs(error) > deadband) {
                id(g_integral) = id(g_integral) + error * 1.0;  // dt = 1s
                // Anti-windup
                if (id(g_integral) > 5.0) id(g_integral) = 5.0;
                if (id(g_integral) < -5.0) id(g_integral) = -5.0;
                float adjust = id(kp_value).state * error + id(ki_value).state * id(g_integral);
                float target_angle = tilt_actual - adjust;
                // Clamp to 0 .. commanded_tilt
                float cmd = id(commanded_tilt).state;
                if (target_angle < 0.0) target_angle = 0.0;
                if (target_angle > cmd) target_angle = cmd;
                // Rate limit
                float max_step = id(max_step_per_sec).state * 1.0;  // dt = 1s
                float step = target_angle - tilt_actual;
                if (step > max_step) step = max_step;
                if (step < -max_step) step = -max_step;
                // Apply step
                if (step > 0.5) {
                  // Need to tilt up (toward commanded), which means extend
                  if (at_ninety) {
                    // Already at 90°, stop
                    id(actuator_stop).execute();
                  } else {
                    id(actuator_extend).execute();
                  }
                } else if (step < -0.5) {
                  // Need to tilt down, which means retract
                  if (at_zero) {
                    id(actuator_stop).execute();
                  } else {
                    id(actuator_retract).execute();
                  }
                } else {
                  id(actuator_stop).execute();
                }
              } else {
                // Within deadband, slowly drift toward commanded
                id(g_integral) = id(g_integral) * 0.9;
                float cmd = id(commanded_tilt).state;
                if (tilt_actual < cmd - 0.5) {
                  if (!at_ninety) id(actuator_extend).execute();
                } else if (tilt_actual > cmd + 0.5) {
                  if (!at_zero) id(actuator_retract).execute();
                } else {
                  id(actuator_stop).execute();
                }
              }
            }
          } else if (strcmp(state, "Monitoring") == 0) {
            // 15 min countdown
            unsigned long elapsed = millis() - id(g_state_entered_ms);
            if (elapsed > 900000) {  // 15 min
              if (i_motor < 0.5 * i_safe_limit) {
                // Wind passed, back to NORMAL
                id(g_integral) = 0.0;
                id(state_to_normal).execute();
              } else {
                // Still windy, fold
                id(state_to_folding).execute();
              }
            }
          } else if (strcmp(state, "Folding") == 0) {
            // Wait for limit switch at 0°
            if (at_zero) {
              id(actuator_stop).execute();
              id(state_to_locked).execute();
            } else if (millis() - id(g_state_entered_ms) > 60000) {
              // Timeout — assume we hit the limit (limit switch may have failed)
              id(actuator_stop).execute();
              id(state_to_locked).execute();
            }
          } else if (strcmp(state, "Locked") == 0) {
            // 30 min hold, then check
            unsigned long elapsed = millis() - id(g_state_entered_ms);
            if (elapsed > 1800000) {  // 30 min
              if (i_motor < 0.3 * i_safe_limit) {
                // Wind really gone, back to NORMAL
                id(g_integral) = 0.0;
                id(state_to_normal).execute();
              } else {
                // Still windy, hold another 30 min
                id(g_state_entered_ms) = millis();
              }
            }
          }

  - interval: 900s
    id: nws_poll_interval
    then:
      - script.execute: nws_poll

  # Note: MPPT loop removed. The Sunapex 10A MPPT runs its own
  # perturb-and-observe internally; the ESP32 no longer commands a
  # charge controller. Battery voltage (read via the 10k/10k divider
  # on GPIO 33) is the only charge-state telemetry on the mini.

  - interval: 300s
    id: dli_update
    then:
      - script.execute: update_dli_estimate

  - interval: 1s
    id: energy_integration
    then:
      - lambda: |-
          // === v2.4: Energy integration (1-Hz) ===
          // Integrate panel V×I every 1s into today + total counters.
          float p = id(panel_power_w).state;
          if (isnan(p)) return;
          // 1 second = 1/3600/1000 kWh of integration
          float delta_kwh = p / 3600.0 / 1000.0;
          // Update today (reset at midnight)
          static float today = 0;
          static int last_doy = -1;
          auto now = id(sntp_time).now();
          if (now.is_valid() && now.day_of_year != last_doy) {
            today = 0;
            last_doy = now.day_of_year;
            id(water_ml_today) = 0;
            id(watering_events_today) = 0;
          }
          today += delta_kwh;
          id(energy_today).publish_state(today);
          // Update total (capped at 10 MWh to prevent float drift)
          float total = id(g_energy_total_kwh) + delta_kwh;
          if (total > 10000.0) total = 10000.0;
          id(g_energy_total_kwh) = total;  // restore_value: true persists across reboots
          id(energy_total).publish_state(total);
          // Update is_night flag for watering decisions
          id(is_night_flag) = (p < 0.5);

  - interval: 60s
    # U5b DRV8871: this tick drives the irrigation solenoid in Auto mode
    # (K1=A → U5b evolution: 5V relay → 2nd DRV8871). Interval id kept as
    # grow_light_tick to preserve state across the rename.
    id: grow_light_tick
    then:
      - lambda: |-
          // === Solenoid auto-watering (U5b DRV8871) ===
          // v2.5: layered safety guards before applying the soil trigger.
          //
          // 1. Mode gate: Off / Manual — leave the switch alone.
          // 2. State interlock: don't water during Folding/Locked.
          // 3. Latched fault alarm: don't retry until user clears.
          // 4. Soil sensor NaN: don't water on bad reading.
          // 5. Battery floor: don't deep-discharge the LiFePO4 pack.
          // 6. Max on-time: force off if exceeded.
          //
          // The mode-1 logic (Auto + soil < 35%) only fires if all
          // the guards above pass.
          const char* mode = id(grow_light_mode).current_option().c_str();
          if (strcmp(mode, "Auto") != 0) {
            return;  // Off or Manual — user is in control
          }
          // 2. State interlock
          const char* ctl = id(controller_state).current_option().c_str();
          if (strcmp(ctl, "Folding") == 0 || strcmp(ctl, "Locked") == 0) {
            id(grow_light_relay).turn_off();
            return;
          }
          // 3. Latched fault alarm
          if (id(g_solenoid_alarm)) {
            id(grow_light_relay).turn_off();
            ESP_LOGW("solenoid", "solenoid alarm latched — auto disabled");
            return;
          }
          // 4. Soil sensor NaN guard
          float soil = id(soil_moisture_pct).state;
          if (isnan(soil)) {
            id(grow_light_relay).turn_off();
            ESP_LOGW("solenoid", "soil sensor NaN — auto disabled");
            return;
          }
          // 5. Battery floor guard
          float v_batt = id(battery_voltage).state;
          if (!isnan(v_batt) && v_batt < id(battery_water_floor_v).state) {
            id(grow_light_relay).turn_off();
            ESP_LOGW("solenoid", "V_batt %.2fV below floor %.2fV — auto disabled",
                     v_batt, id(battery_water_floor_v).state);
            return;
          }
          // 6. Max on-time watchdog
          if (id(g_solenoid_on_since_ms) != 0) {
            unsigned long on_since = id(g_solenoid_on_since_ms);
            unsigned long now = millis();
            unsigned long elapsed_ms = (now >= on_since)
                ? (now - on_since)
                : (0xFFFFFFFFUL - on_since) + now + 1;
            if (elapsed_ms / 1000UL >= (unsigned long)id(solenoid_max_water_sec).state) {
              id(grow_light_relay).turn_off();
              id(g_solenoid_alarm) = true;  // latch — user must clear
              ESP_LOGE("solenoid",
                       "Max on-time %us exceeded (elapsed %ums) — FORCED OFF + alarm",
                       (unsigned)id(solenoid_max_water_sec).state, (unsigned)elapsed_ms);
              return;
            }
          }
          // Primary control: water when soil < 35%.
          // 35% is "needs water" for a typical garden bed using the
          // 0-100% mapping (dry ~0%, wet ~100%).
          if (soil < 35.0) {
            id(grow_light_relay).turn_on();
          } else {
            id(grow_light_relay).turn_off();
          }

  - interval: 100ms
    # v3.2: Endpoint detector (current-based homing).
    # Watches motor IPROPI for a sustained spike. When i_motor_ipropi
    # stays above `endstop_current_threshold` for >= 500 ms, the
    # actuator has hit an endstop. Direction is read from the H-bridge
    # output switches (hb_in1_sw / hb_in2_sw) so we know whether to set
    # g_at_zero (retracted) or g_at_max (extended).
    #
    # 1000 ms debounce (was 200 ms in v3.1, 3000 ms in early v3.2)
    # balances two failure modes: too short and motion artifacts
    # (inrush, slop) trigger false positives; too long and the small
    # actuator here doesn't hold the stall long enough (it bounces
    # off the endstop in ~1 s). With threshold 0.90 A (between
    # running 0.84 A and stall 1.0 A) the 1000 ms window catches the
    # endstop reliably enough on a 0.5" stroke actuator.
    id: endpoint_detector
    then:
      - lambda: |-
          static unsigned long spike_start_ms = 0;
          float i_prop = id(motor_current_ipropi).state;
          if (isnan(i_prop)) {
            spike_start_ms = 0;
            return;
          }
          float threshold = id(endstop_current_threshold).state;
          if (i_prop > threshold) {
            if (spike_start_ms == 0) spike_start_ms = millis();
            if (millis() - spike_start_ms > 1000) {
              bool in1 = id(hb_in1_sw).state;
              bool in2 = id(hb_in2_sw).state;
              if (in1 && !in2) {
                // Extending -> hit the 35° endstop
                id(g_at_max) = true;
                id(g_at_zero) = false;
                id(g_endstop_last_hit_ms) = millis();
                id(g_calib_extend_a) = i_prop;  // capture at the moment of detection
                ESP_LOGI("endpoint", "Endstop hit: AT MAX (i=%.2f A)", i_prop);
              } else if (!in1 && in2) {
                // Retracting -> hit the 0° endstop
                id(g_at_zero) = true;
                id(g_at_max) = false;
                id(g_endstop_last_hit_ms) = millis();
                id(g_calib_retract_a) = i_prop;  // capture at the moment of detection
                ESP_LOGI("endpoint", "Endstop hit: AT ZERO (i=%.2f A)", i_prop);
              }
              // If both or neither switch is on, the spike is invalid
              // (e.g. a load spike while stopped) — ignore.
            }
          } else {
            spike_start_ms = 0;
          }

  - interval: 5s
    id: alive_tick
    then:
      - lambda: 'ESP_LOGD("alive_tick", "alive, state=%s tilt=%.1f°",
                    id(controller_state).current_option().c_str(),
                    id(panel_tilt).state);'


